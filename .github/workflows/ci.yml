name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a specific minor version — see comment in release.yml.
      - uses: actions/setup-go@v5.0.2
        with:
          go-version: "1.22"
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
