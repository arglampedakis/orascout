name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. (Also keeps CodeQL's
# "workflow does not contain permissions" check happy.)
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a specific minor version — see comment in release.yml.
      - uses: actions/setup-go@v5.0.2
        with:
          go-version: "1.25"
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
