<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>orascout static demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; background: #e0f4ff; }
    .v { background: #84d0ff; padding: 0.25rem 0.5rem; border-radius: 0.25rem; }
  </style>
</head>
<body>
  <h1>Hello from <span class="v">v1</span> (static)</h1>
  <p>This page is served by nginx out of <code>/var/www/html</code>.
     orascout wrote it here from the <code>hello-dist</code> artifact.</p>
  <p>Push v2 with <code>docker compose run --rm pusher v2</code> and reload
     to see the static deploy update — no nginx restart needed.</p>
</body>
</html>
