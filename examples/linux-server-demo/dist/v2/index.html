<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>orascout static demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; background: #fff7e6; }
    .v { background: #ffd97a; padding: 0.25rem 0.5rem; border-radius: 0.25rem; }
  </style>
</head>
<body>
  <h1>Hello from <span class="v">v2</span> (static)</h1>
  <p>orascout has replaced the contents of <code>/var/www/html</code> with
     this v2 page. Background went blue → amber and you didn't have to touch
     nginx.</p>
</body>
</html>
