server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Disable caching so orascout's static deploys are immediately visible
    # in the browser without a hard refresh. Remove this for production.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
