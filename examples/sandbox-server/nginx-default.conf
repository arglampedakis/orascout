server {
    listen 80 default_server;
    server_name _;

    # The UI is mounted at /Bar-UI/. Adjust to your own per-app subpath
    # convention; the convention here is /var/www/html/<AppName>/.
    location /Bar-UI/ {
        alias /var/www/html/Bar-UI/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Redirect the root to /Bar-UI/ for convenience in the demo.
    location = / {
        return 302 /Bar-UI/;
    }
}
